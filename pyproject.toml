[project]
name = "local-elections-telangana"
version = "0.1.0"
description = "Telangana gram panchayat sarpanch elections, 2019 and 2025, with sources and checks"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Telangana", "elections", "panchayats", "sarpanch", "reservation", "data"]
dependencies = [
    "beautifulsoup4>=4.13",
    "frictionless>=5.21",
    "pandas>=2.3",
    "pandera[io]>=0.34",
    "pyarrow>=21",
    "requests>=2.32",
]

[project.urls]
Repository = "https://github.com/in-rolls/local_elections_telangana"
Issues = "https://github.com/in-rolls/local_elections_telangana/issues"

[dependency-groups]
collect = [
    "pysocks>=1.7.1",
]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_elections_telangana"]
